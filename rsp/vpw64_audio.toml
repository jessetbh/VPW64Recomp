# RSPRecomp config for VPW64's AUDIO microcode. Recon 2026-07-12 (vpw_recon.py):
# WT's STOCK aspMain (byte-identical to BMHero's) found BYTE-IDENTICAL in
# vpw64.z64 at ROM 0x2B410, full 0xE20 bytes — the expected sibling case, so
# everything from WT's wcw_audio.toml transfers verbatim except text_offset.
# rspboot text precedes it at 0x2B340; gfx ucode text follows (RT64's job, not ours).
# text_address 0x04001080 = where rspboot places task ucode in IMEM (all sisters).
# Run from repo root:  .\RSPRecomp.exe rsp\vpw64_audio.toml  (paths relative to rsp/).
text_offset = 0x2B410
text_size = 0xE20
text_address = 0x04001080
rom_file_path = "../vpw64.z64"
output_file_path = "vpw64_audio.cpp"
output_function_name = "vpw64_audio_ucode"

# WT/BMHero aspMain jump-table targets — valid ONLY if the ucode byte-matches WT's:
extra_indirect_branch_targets = [
	0x1118, 0x1470, 0x11DC, 0x1B38, 0x1214, 0x187C, 0x1254, 0x12D0,
	0x12EC, 0x1328, 0x140C, 0x1294, 0x1E24, 0x138C, 0x170C, 0x144C
]
