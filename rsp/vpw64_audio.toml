# RSPRecomp config for VPW64's AUDIO microcode — SKELETON, pending ROM recon.
# VPW64 is WT's 1997 sibling: expect WT's STOCK aspMain ucode (byte-identical to
# BMHero's), NOT the newer AKI revision Revenge/WM2000 ship. Recon step: search
# vpw64.z64 for WT's ucode text bytes (WT: ROM 0x2A850, size 0xE20 — see
# ..\WcwNwoWorldTour\rsp\wcw_audio.toml and rsp/README.md there). If it matches,
# everything below transfers verbatim except text_offset; if not, fall back to
# Revenge's newer-ucode method (..\WcwRevengeRecomp\rsp\README.md, incl. the
# 12-bit-PC jump-table gotcha).
# text_address 0x04001080 = where rspboot places task ucode in IMEM (all sisters).
# Run from repo root:  .\RSPRecomp.exe rsp\vpw64_audio.toml  (paths relative to rsp/).
text_offset = 0x0        # TODO(recon): ROM offset of the audio ucode text
text_size = 0xE20        # WT's aspMain size; verify against the gfx-ucode start
text_address = 0x04001080
rom_file_path = "../vpw64.z64"
output_file_path = "vpw64_audio.cpp"
output_function_name = "vpw64_audio_ucode"

# WT/BMHero aspMain jump-table targets — valid ONLY if the ucode byte-matches WT's:
extra_indirect_branch_targets = [
	0x1118, 0x1470, 0x11DC, 0x1B38, 0x1214, 0x187C, 0x1254, 0x12D0,
	0x12EC, 0x1328, 0x140C, 0x1294, 0x1E24, 0x138C, 0x170C, 0x144C
]
