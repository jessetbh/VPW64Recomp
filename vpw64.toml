# N64Recomp config for Virtual Pro Wrestling 64 (Japan). Adapted from WM2000's
# wm2k.toml (which came from Revenge's, which came from World Tour's wcw.toml).
# VPW64 is WT's direct 1997 sibling — expect WT's exact architecture: entrypoint
# 0x80000400, fixed segment rom 0x1000 <-> vram 0x80000400, TWO overlays sharing
# one vram slot (9-word descriptor table in fixed-segment data). Symbol-TOML mode.

[input]
entrypoint = 0x80000400
rom_file_path = "vpw64.z64"
bss_section_suffix = "_bss"
symbols_file_path = "syms/dump.toml"
output_func_path = "RecompiledFuncs"
trace_mode = false

[patches]
# Functions containing cop0/cache/eret/tlb opcodes are stubbed (syms/
# stub_candidates.txt, regenerated by tools/gen_stubs.py which rewrites this block —
# do NOT put comments inside it). ALL NINE CLASSIFIED 2026-07-12 (vpw_recon4.py:
# each reverse-fingerprints onto the function WT also stubs — see WT's wcw.toml for
# the same set with rationale). Host-meaningless libultra internals; stubs CORRECT:
#   func_8001D4D0 = __osSetSR (mtc0 SR)          [WT func_8001CCA0]
#   func_8001D4E0 = __osGetSR (mfc0 SR)          [WT func_8001CCB0]
#   func_8001D5A0 = __osException handler 0x544  [WT func_8001CD70; never called —
#                   only address-referenced by osInitialize's vector install]
#   func_8001DA9C = shared-tail entry inside the exception handler (recomp_loop
#                   injected)                    [WT func_8001CD70+0x4FC]
#   func_8001DBCC = exception thread-ctx save    [WT func_8001D39C]
#   func_8001DD24 = exception/interrupt dispatch [WT func_8001D4F4]
#   func_8001DEB0 = osUnmapTLBAll (EntryHi/Index)[WT func_8001D680]
#   func_8001F4C0 = __osProbeTLB                 [WT func_8001EC90]
#   func_80026640 = __osSetCompare (mtc0 $11)    [WT func_80025D30]
# (osGetCount is NOT here — named day-0; WT's lesson: stubbing it freezes the
# game clock and timed intro waits never complete.)
stubs = [
    "func_8001D4D0",
    "func_8001D4E0",
    "func_8001D5A0",
    "func_8001DA9C",
    "func_8001DBCC",
    "func_8001DD24",
    "func_8001DEB0",
    "func_8001F4C0",
    "func_80026640",
]

ignored = [
]

# Idle-thread cooperative-yield fix — WT's exact pattern at nearly the same address
# (boot2 2026-07-12: WCW_HEALTH_LOG showed the classic ext-backlog-growing/del=0 spin).
# Idle thread func_800004AC (same name as WT's!) parks in
#   L_8000058C: jal func_80012280; nop; b L_8000058C
# The backward branch at 0x80000594 targets the jal, not itself, so N64Recomp doesn't
# emit pause_self(); under ultramodern's cooperative scheduler the spin never yields.
# Rewrite it into `b .` (0x1000FFFF) so the recompiler emits pause_self() — see
# WT's wcw.toml for the full explanation.
[[patches.instruction]]
func = "func_800004AC"
vram = 0x80000594
value = 0x1000FFFF
