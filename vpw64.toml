# N64Recomp config for Virtual Pro Wrestling 64 (Japan). Adapted from WM2000's
# wm2k.toml (which came from Revenge's, which came from World Tour's wcw.toml).
# VPW64 is WT's direct 1997 sibling — expect WT's exact architecture: entrypoint
# 0x80000400, fixed segment rom 0x1000 <-> vram 0x80000400, TWO overlays sharing
# one vram slot (9-word descriptor table in fixed-segment data). Symbol-TOML mode.

[input]
entrypoint = 0x80000400
rom_file_path = "vpw64.z64"
bss_section_suffix = "_bss"
symbols_file_path = "syms/dump.toml"
output_func_path = "RecompiledFuncs"
trace_mode = false

[patches]
# First-recompile bootstrap, mirroring the sisters: functions containing cop0/cache/
# eret/tlb opcodes are stubbed (syms/stub_candidates.txt, regenerated by
# tools/gen_stubs.py which rewrites this block). As identification proceeds these
# move to RENAMEs in tools/gen_symbols.py so the runtime provides them.
stubs = [
]

ignored = [
]

# NOTE for bring-up: every sister needed the idle-thread cooperative-yield fix — the
# main thread parks in a `jal <spin>; j <back>` busy loop after launching all threads,
# which never yields under ultramodern's cooperative scheduler (symptom: WCW_HEALTH_LOG
# shows ext backlog growing with del/s=0, vis/s=0). Find VPW64's equivalent (WT:
# wcw.toml; Revenge: 0x80000568; WM2000: j at 0x800005AC in func_800004D0) and add:
#   [[patches.instruction]]
#   func = "func_XXXXXXXX"
#   vram = 0xXXXXXXXX
#   value = 0x1000FFFF   # rewrite the backward j into `b .` -> N64Recomp emits pause_self
