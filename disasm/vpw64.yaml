# splat config for Virtual Pro Wrestling 64 (Japan) — recon 2026-07-12 (vpw_recon*.py):
#   - entry stub (rom 0x1000): clears bss 0x8004A060 +0x28C60, sp 0x8004C210,
#     jumps to game_main 0x80000450 (= rom 0x1050, same as WT)
#   - fixed-segment code ends 0x2B338 (last jr $ra 0x2B330); rspboot text begins
#     0x2B340, audio ucode (WT's stock aspMain, BYTE-IDENTICAL) at 0x2B410 +0xE20,
#     gfx ucode follows — whole ucode block identical to WT's for 0x3641 bytes.
#     No jr $ra anywhere 0x2F000..0x4AC60 -> data subsegment starts 0x2B340.
#   - overlay descriptor table at rom 0x3FAC0/0x3FAE4 (vram 0x8003EEC0/0x8003EEE4),
#     WT's exact architecture: TWO overlays, ONE shared vram slot 0x80088000
#     (WT's was 0x80090000). Bounds below are byte-exact from the descriptors.
name: Virtual Pro Wrestling 64 (Japan)
sha1: f9e9fa2ed819c3a39db5cb6afeca186f021db5ed
options:
  basename: vpw64
  target_path: vpw64.z64
  elf_path: build/vpw64.elf
  base_path: .
  platform: n64
  compiler: IDO

  asm_path: asm
  data_path: asm/data
  ld_script_path: vpw64.ld
  ld_dependencies: True

  find_file_boundaries: True
  # JP ROM: internal name is half-width katakana (single-byte Shift-JIS range)
  header_encoding: shift_jis

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  symbol_addrs_path:
    - symbol_addrs.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  undefined_funcs_auto_path: undefined_funcs_auto.txt
  undefined_syms_auto_path: undefined_syms_auto.txt

  libultra_symbols: True
  hardware_regs: True

  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, hasm]

  - name: main
    type: code
    start: 0x1050
    vram: 0x80000450
    follows_vram: entry
    bss_size: 0x28C60
    subsegments:
      - [0x1050, asm]
      - [0x2B340, data]
      - { type: bss, vram: 0x8004A060 }

  # ~15 MB of assets between the fixed segment and the overlay region at the ROM
  # tail. No CPU code here (jr-ra density scan, vpw_recon.py).
  - name: assets
    type: bin
    start: 0x4AC60
    follows_vram: main

  # Two CPU overlays, BOTH loaded to vram 0x80088000 (mutually-exclusive swap, WT's
  # exact scheme). Section boundaries byte-exact from the 9-word descriptors at
  # rom 0x3FAC0 / 0x3FAE4 (vram 0x8003EEC0 / 0x8003EEE4).
  - name: ovl_a
    type: code
    start: 0xF1AF80
    vram: 0x80088000
    exclusive_ram_id: ovl_88000
    bss_size: 0x1CCF0
    subsegments:
      - [0xF1AF80, asm]
      - [0xF55240, data]
      - { type: bss, vram: 0x800DA1F0 }

  - name: ovl_b
    type: code
    start: 0xF6D170
    vram: 0x80088000
    exclusive_ram_id: ovl_88000
    bss_size: 0xEF00
    subsegments:
      - [0xF6D170, asm]
      - [0xFCD4D0, data]
      - { type: bss, vram: 0x800EC2C0 }

  # Tail: remaining assets/padding after the overlay region.
  - name: assets_tail
    type: bin
    start: 0xFD1430

  - [0x1000000]  # ROM size confirmed: 16 MB exactly (vs WT's 12 MB)
